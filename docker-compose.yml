# Optional: local PostgreSQL. Use it by setting DATABASE_URL in backend/.env
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: university
      POSTGRES_USER: university
      POSTGRES_PASSWORD: university
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
